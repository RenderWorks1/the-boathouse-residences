<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Boathouse Residences</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="The Boathouse Residences — luxury waterfront living. Our website is coming soon. Get in touch to enquire."
    />
    <link rel="icon" href="/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow-x: hidden;
      }
      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        /* Brand "Tide" #6C7E8C */
        background: #6c7e8c;
        background: linear-gradient(180deg, #77899544 0%, #6c7e8c 45%, #647581 100%);
        background-color: #6c7e8c;
        color: #ffffff;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(2rem, 6vw, 3.25rem);
        width: 100%;
        max-width: 34rem;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.75rem, 5vw, 2.75rem);
      }
      .logo {
        width: min(86vw, 30rem);
        height: auto;
      }
      .eyebrow {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.38em;
        font-size: clamp(1.05rem, 1.1vw + 0.75rem, 1.35rem);
        font-weight: 400;
        /* nudge right to optically balance the trailing letter-spacing */
        text-indent: 0.38em;
        color: rgba(255, 255, 255, 0.78);
      }
      .enquire {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.75rem, 5vw, 2.75rem);
      }
      .lede {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: clamp(0.85rem, 0.8vw + 0.7rem, 1rem);
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.85);
      }
      .rule {
        width: 3rem;
        height: 1px;
        background: rgba(255, 255, 255, 0.4);
      }
      .contact {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .contact a {
        color: #ffffff;
        text-decoration: none;
        font-size: clamp(0.95rem, 1vw + 0.8rem, 1.25rem);
        letter-spacing: 0.01em;
        max-width: 100%;
        overflow-wrap: anywhere;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease;
      }
      .contact a:hover {
        border-color: rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <img
          class="logo"
          src="/logos/logo-white.png"
          alt="The Boathouse Residences"
          width="440"
          height="120"
        />
        <p class="eyebrow">Coming Soon</p>
      </div>
      <span class="rule" aria-hidden="true"></span>
      <div class="enquire">
        <p class="lede">For enquiries, please get in touch.</p>
        <div class="contact">
          <a href="mailto:sales@boathouseresidences.co.nz">sales@boathouseresidences.co.nz</a>
          <a href="tel:+642102720203">+64 21 027 20203</a>
        </div>
      </div>
    </main>
  </body>
</html>
